[package]
name = "claude-house-cli"
version = "0.1.0"
edition = "2021"
description = "`ch`: manage Claude House profiles from the command line."

[[bin]]
name = "ch"
path = "src/main.rs"

[dependencies]
claude-house-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
winreg = "0.55"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
