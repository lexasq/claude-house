[package]
name = "claude-house-cli"
version = "0.1.0"
edition = "2021"
description = "`ch`: manage Claude House profiles from the command line."

[[bin]]
name = "ch"
path = "src/main.rs"

[dependencies]
claude-house-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
