[package]
name = "claude-house-cli"
version = "0.1.0"
edition = "2021"
description = "`ch` (command line) and `ch-link` (the claude:// handler) over claude-house-ops."

[[bin]]
name = "ch"
path = "src/main.rs"

[dependencies]
claude-house-core = { path = "../core" }
claude-house-ops = { path = "../ops" }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
