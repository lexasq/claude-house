<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude House</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Claude House</h1>
      <p class="sub">Each profile is a separate Claude Desktop sign-in with its own data folder.</p>
    </header>

    <section class="card routing" aria-labelledby="routing-title">
      <div>
        <h2 id="routing-title">Login routing</h2>
        <p id="routing-text" class="muted">Checking…</p>
      </div>
      <label class="switch">
        <input id="routing-toggle" type="checkbox" disabled>
        <span class="track" aria-hidden="true"></span>
        <span class="sr">Send Google logins to the profile that started them</span>
      </label>
    </section>

    <section aria-labelledby="profiles-title">
      <h2 id="profiles-title">Accounts</h2>
      <ul id="profiles" class="profiles"></ul>
      <p id="empty" class="card empty" hidden>No accounts yet. Add one below, open it and sign in. Each account keeps its own sessions.</p>
    </section>

    <section id="main-section" class="card main-copy" aria-labelledby="main-title" hidden>
      <div class="main-head">
        <div>
          <h2 id="main-title">Main Claude <span id="main-badge" class="badge"></span></h2>
          <p id="main-text" class="muted"></p>
        </div>
        <button id="main-open" type="button">Open</button>
      </div>
      <form id="import-form" class="import" autocomplete="off" hidden>
        <label>Import it as an account named
          <input id="import-name" required maxlength="64" value="Main account">
        </label>
        <button type="submit" class="primary">Import</button>
      </form>
      <p id="main-warn" class="warn" hidden></p>
    </section>

    <section class="card" aria-labelledby="add-title">
      <h2 id="add-title">Add a profile</h2>
      <form id="add-form" autocomplete="off">
        <label>Name
          <input id="add-name" required maxlength="64" placeholder="Work account">
        </label>
        <label>ID <span class="muted">— used for its folder, can't change later</span>
          <input id="add-id" required maxlength="32" pattern="[a-z0-9]([a-z0-9-]*[a-z0-9])?" placeholder="work-account">
        </label>
        <div class="row">
          <label class="color">Colour
            <input id="add-color" type="color" value="#d97757">
          </label>
          <label class="check">
            <input id="add-isolate" type="checkbox">
            Separate Code tab settings
          </label>
        </div>
        <button type="submit" class="primary">Add profile</button>
      </form>
    </section>

    <p id="message" class="message" role="status" aria-live="polite"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
