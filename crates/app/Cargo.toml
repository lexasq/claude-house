[package]
name = "claude-house-app"
version = "0.1.0"
edition = "2021"
description = "Claude House window and tray app."

[[bin]]
name = "claude-house"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
claude-house-cli = { path = "../cli" }
claude-house-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
