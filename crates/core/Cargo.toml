[package]
name = "claude-house-core"
version = "0.1.0"
edition = "2021"
description = "Rules for Claude House as pure functions (profiles, launch commands, claude:// routing, sign-in state), plus profiles.json storage."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
